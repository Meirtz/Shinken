<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- CRIU memory-tier session/a11y bus (images/linux/start-criu.sh).

     ONE dbus-daemon serves both the session bus and the AT-SPI accessibility bus
     (DBUS_SESSION_BUS_ADDRESS and AT_SPI_BUS_ADDRESS point at the same socket), and
     this config is deliberately minimal so the daemon is CRIU-dumpable on CRIU 3.17:

     - NO <standard_session_servicedirs/>, <servicedir> or <includedir>: each of those
       adds an inotify watch on an overlayfs directory whose file handle CRIU cannot
       open (irmap fallback needed; measured failure in the tier bring-up) — with no
       watch dirs the daemon holds zero watches;
     - no service activation means no org.a11y.Bus launcher either — the stock
       at-spi-bus-launcher holds a glib child-watch PIDFD on its spawned bus daemon,
       which CRIU 3.17 cannot dump (anon_inode:[pidfd]); instead start-criu.sh runs
       at-spi2-registryd directly and publishes the bus via AT_SPI_BUS_ADDRESS, which
       libatspi (and shinkend) checks FIRST.

     The wide-open policy matches the stock accessibility bus posture: everything in
     this single-user sandbox desktop may own names and talk to everything. -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/tmp/shinken-session-bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
    <allow user="*"/>
  </policy>
</busconfig>

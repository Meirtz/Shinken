[package]
name = "shinkend"
version = "0.0.0"
edition = "2021"
description = "Shinken Guest Runtime — the in-Sandbox daemon that executes the ACI and emits the event stream."
license = "Apache-2.0"
repository = "https://github.com/Meirtz/Shinken"
publish = false

[[bin]]
name = "shinkend"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# xtest: synthetic input. damage: XDamage change tracking — the event-driven capture
# path (an idle tick captures NOTHING; an active tick fetches only the damaged region).
x11rb = { version = "0.13", features = ["xtest", "damage"] }
png = "0.17"
# Pure-Rust baseline JPEG encoder (no C deps) — keeps the static musl build portable
# while giving the screenshot/screencast bandwidth lever (PNG ~1.8 MB → JPEG ~0.1 MB @1080p).
jpeg-encoder = "0.6"
base64 = "0.22"

[profile.release]
strip = true
lto = true

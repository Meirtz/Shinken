[package]
name = "shinkend"
version = "0.0.0"
edition = "2021"
description = "Shinken Guest Runtime — the in-Sandbox daemon that executes the ACI and emits the event stream."
license = "Apache-2.0"
repository = "https://github.com/Meirtz/Shinken"
publish = false

[[bin]]
name = "shinkend"
path = "src/main.rs"

[features]
default = ["macos-native"]
# The native macOS executor (CoreGraphics capture + CGEvent input). On by default;
# compiles to nothing on non-macOS targets, so the Linux build is untouched. Disable
# with --no-default-features to build a mac binary without the native backend.
macos-native = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "process"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# xtest: synthetic input. damage: XDamage change tracking — the event-driven capture
# path (an idle tick captures NOTHING; an active tick fetches only the damaged region).
x11rb = { version = "0.13", features = ["xtest", "damage"] }
png = "0.17"
# Pure-Rust baseline JPEG encoder (no C deps) — keeps the static musl build portable
# while giving the screenshot/screencast bandwidth lever (PNG ~1.8 MB → JPEG ~0.1 MB @1080p).
jpeg-encoder = "0.6"
base64 = "0.22"
# XXH3-128 for the wire `frame_hash` (screenshot dedup identity) and XXH3-64 for
# screencast idle suppression. Chosen over `blake3`: both are pure Rust (musl-static
# friendly), but xxhash-rust is dependency-free (blake3 pulls arrayref/arrayvec/
# cfg-if/constant_time_eq + a build script) and XXH3 is several times faster per
# byte on arm64 NEON, which matters at ~3 MB per 1280x800 frame on every observe.
# We don't need a cryptographic hash here — see `frame_hash_hex` for the collision
# failure-mode analysis.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Structured observation (M1b): AT-SPI over D-Bus, pure Rust (zbus), tokio backend —
# all bus work runs on one dedicated worker thread (src/atspi_source.rs).
atspi = { version = "0.30.0", default-features = false, features = ["connection", "proxies", "tokio", "wrappers", "zbus"] }

# Typed exec channel (G1): the timeout kill must reach the child's whole PROCESS
# GROUP (killpg), which std/tokio expose no API for — one libc call, unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS native executor (feature `macos-native`): CoreGraphics/Quartz capture +
# CGEvent input synthesis. v1 uses the CG APIs (CGDisplayCreateImage /
# CGWindowListCreateImage — deprecated since macOS 14 but functional); the
# ScreenCaptureKit upgrade path is documented in docs/engineering/macos-engine.md.
[target.'cfg(target_os = "macos")'.dependencies]
# `highsierra` unlocks CGEventCreateScrollWheelEvent2 (pixel-denominated scroll).
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"

[profile.release]
strip = true
lto = true
